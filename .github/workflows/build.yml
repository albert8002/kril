name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore previous snapshot
        uses: actions/cache/restore@v4
        with:
          path: snapshot-out
          key: snap-r${{ github.run_id }}
          restore-keys: snap-
      - name: Fetch + rank live Wikidata / Wikipedia lists (incremental)
        continue-on-error: true
        timeout-minutes: 22
        env:
          SNAP_BUDGET_MIN: "15"
        run: |
          set -o pipefail
          chmod +x gradlew
          mkdir -p snapshot-out
          ls -la snapshot-out || true
          ./gradlew :snapshot:run --args="$GITHUB_WORKSPACE/snapshot-out" 2>&1 | tee build.log
      - name: Save snapshot
        if: hashFiles('snapshot-out/live_wikidata.json') != ''
        uses: actions/cache/save@v4
        with:
          path: snapshot-out
          key: snap-r${{ github.run_id }}-${{ github.run_attempt }}
      - name: Merge snapshot into bundled packs
        run: |
          python3 - <<'PY'
          import json, os, shutil, glob
          packs = "composeApp/src/commonMain/composeResources/files/packs"
          idx = json.load(open(f"{packs}/index.json"))
          for f in sorted(glob.glob("snapshot-out/live_*.json")):
              name = os.path.basename(f)
              if os.path.getsize(f) < 20000:
                  continue
              shutil.copy(f, f"{packs}/{name}")
              if name not in idx["packs"]:
                  idx["packs"].append(name)
              print("bundled", name, os.path.getsize(f), "bytes")
          json.dump(idx, open(f"{packs}/index.json", "w"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-packs
          path: composeApp/src/commonMain/composeResources/files/packs/
      - name: Publish snapshot log
        if: always()
        run: bash .github/publish-log.sh snapshot "${{ job.status }}" "${{ github.token }}"

  android:
    needs: [ snapshot ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: live-packs
          path: composeApp/src/commonMain/composeResources/files/packs/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease --stacktrace 2>&1 | tee build.log
          mkdir -p dist
          cp composeApp/build/outputs/apk/release/*.apk dist/CoreDump.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CoreDump-android
          path: dist/CoreDump.apk
      - name: Publish build log
        if: always()
        run: bash .github/publish-log.sh android "${{ job.status }}" "${{ github.token }}"

  emu:
    needs: [ android ]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CoreDump-android
          path: dist/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        continue-on-error: true
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/emu-test.sh
      - name: Publish emulator output
        if: always()
        run: bash .github/publish-dir.sh emu "$GITHUB_WORKSPACE/emu-out" "${{ github.token }}"

  ios:
    needs: [ snapshot ]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: live-packs
          path: composeApp/src/commonMain/composeResources/files/packs/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          chmod +x gradlew
          xcodebuild \
            -project iosApp/CoreDump.xcodeproj \
            -scheme CoreDump \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          mkdir -p dist/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/CoreDump.app dist/Payload/
          cd dist && zip -qry CoreDump-unsigned.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CoreDump-ios
          path: dist/CoreDump-unsigned.ipa
      - name: Publish build log
        if: always()
        run: bash .github/publish-log.sh ios "${{ job.status }}" "${{ github.token }}"

  release:
    needs: [ android, ios ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: CoreDump-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CORE DUMP build ${{ github.run_number }}
          body: |
            CoreDump.apk — install directly on Android (allow unknown sources).
            CoreDump-unsigned.ipa — sideload with AltStore / SideStore / Sideloadly (they sign it with your Apple ID).
          files: |
            out/CoreDump.apk
            out/CoreDump-unsigned.ipa
