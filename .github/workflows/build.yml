name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore previous snapshot
        uses: actions/cache/restore@v4
        with:
          path: snapshot-out
          key: snap-r${{ github.run_id }}
          restore-keys: snap-
      - name: Fetch + rank live Wikidata / Wikipedia lists (incremental)
        continue-on-error: true
        timeout-minutes: 22
        env:
          SNAP_BUDGET_MIN: "15"
        run: |
          set -o pipefail
          chmod +x gradlew
          mkdir -p snapshot-out
          ls -la snapshot-out || true
          ./gradlew :snapshot:run --args="$GITHUB_WORKSPACE/snapshot-out" 2>&1 | tee build.log
      - name: Save snapshot
        if: hashFiles('snapshot-out/live_wikidata.json') != ''
        uses: actions/cache/save@v4
        with:
          path: snapshot-out
          key: snap-r${{ github.run_id }}-${{ github.run_attempt }}
      - name: Merge snapshot into bundled packs (split into small chunks)
        run: |
          python3 - <<'PY'
          import json, os, glob
          packs = "composeApp/src/commonMain/composeResources/files/packs"
          idx = json.load(open(f"{packs}/index.json"))
          idx["packs"] = [p for p in idx["packs"] if not p.startswith("live_")]
          for f in sorted(glob.glob("snapshot-out/live_*.json")):
              if os.path.getsize(f) < 20000:
                  continue
              src = json.load(open(f))
              base = os.path.basename(f)[:-5]
              prompts = src.get("prompts", [])
              size, chunk, n = 0, [], 0
              def flush():
                  global chunk, size, n
                  if not chunk: return
                  name = f"{base}_{n:02d}.json"
                  out = dict(src); out["prompts"] = chunk
                  json.dump(out, open(f"{packs}/{name}", "w"), separators=(",", ":"), ensure_ascii=False)
                  idx["packs"].append(name); n += 1; chunk, size = [], 0
              for p in prompts:
                  chunk.append(p); size += len(json.dumps(p))
                  if size > 350_000: flush()
              flush()
              print("bundled", base, len(prompts), "prompts in", n, "chunks")
          json.dump(idx, open(f"{packs}/index.json", "w"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-packs
          path: composeApp/src/commonMain/composeResources/files/packs/
      - name: Publish snapshot log
        if: always()
        run: bash .github/publish-log.sh snapshot "${{ job.status }}" "${{ github.token }}"

  poolcheck:
    # Queries every on-device pool template once and publishes the results (review aid; never blocks a build).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check pool templates
        timeout-minutes: 25
        env:
          SNAP_BUDGET_MIN: "18"
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :snapshot:run --args="--pool-check wx.tv.animated,wx.tv.miniseries,wx.mv.studio,wx.mv.festival,wx.mv.bollywood,wx.mv.anime,wx.mv.teen,wx.mv.spy,wx.mv.biopic,wx.mv.adventure,wx.gm.mmo,wx.gm.sports,wx.gm.switch,wx.gm.ps4,wx.gm.n64,wx.gm.snes,wx.gm.gameboy,wx.gm.publisher,wx.tc.smartphone,wx.tc.app,wx.tc.search,wx.tc.programmer,wx.ho.horrornovel,wx.wo.writing,wx.wo.figure,wx.wo.conlang,wx.wo.signlang,wx.bd.infection,wx.bd.cancer,wx.my.hindu,wx.na.glacier,wx.na.canyon,wx.na.forest,wx.na.earthquake,wx.sc.mission,wx.ev.boat,wx.fd.beerstyle,wx.fd.cuisine,wx.br.newsagency,wx.pc.fictcity,wx.pc.fictcountry,wx.bk.artmuseum,wx.bk.poem,wx.bk.play,wx.bk.opera,wx.bk.novel,wx.bk.childrens,wx.bk.fantasy,wx.bk.scifi,wx.bk.detective,wx.hi.treaty,wx.hi.pharaoh,wx.hi.ukpm,wx.mu.orchestra,wx.an." 2>&1 | tee build.log
      - name: Publish pool check log
        if: always()
        run: |
          grep "POOL \|SEARCH " build.log > pool.txt || true
          cp pool.txt build.log
          bash .github/publish-log.sh poolcheck "${{ job.status }}" "${{ github.token }}"

  android:
    needs: [ snapshot ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: live-packs
          path: composeApp/src/commonMain/composeResources/files/packs/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :composeApp:assembleRelease --stacktrace 2>&1 | tee build.log
          mkdir -p dist
          cp composeApp/build/outputs/apk/release/*.apk dist/CoreDump.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CoreDump-android
          path: dist/CoreDump.apk
      - name: Publish build log
        if: always()
        run: bash .github/publish-log.sh android "${{ job.status }}" "${{ github.token }}"

  emu:
    needs: [ android ]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CoreDump-android
          path: dist/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        continue-on-error: true
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash .github/emu-test.sh
      - name: Publish emulator output
        if: always()
        run: bash .github/publish-dir.sh emu "$GITHUB_WORKSPACE/emu-out" "${{ github.token }}"

  ios:
    needs: [ snapshot ]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: live-packs
          path: composeApp/src/commonMain/composeResources/files/packs/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate
      - name: Build unsigned IPA
        run: |
          set -o pipefail
          chmod +x gradlew
          xcodebuild \
            -project iosApp/CoreDump.xcodeproj \
            -scheme CoreDump \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log
          mkdir -p dist/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/CoreDump.app dist/Payload/
          cd dist && zip -qry CoreDump-unsigned.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CoreDump-ios
          path: dist/CoreDump-unsigned.ipa
      - name: Publish build log
        if: always()
        run: bash .github/publish-log.sh ios "${{ job.status }}" "${{ github.token }}"

  iossim:
    needs: [ snapshot ]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: live-packs
          path: composeApp/src/commonMain/composeResources/files/packs/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Build for the simulator
        continue-on-error: true
        run: |
          set -o pipefail
          brew install xcodegen
          cd iosApp && xcodegen generate && cd ..
          chmod +x gradlew
          xcodebuild -project iosApp/CoreDump.xcodeproj -scheme CoreDump -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -5
      - name: Run self-test in the simulator
        continue-on-error: true
        timeout-minutes: 25
        run: bash .github/sim-test.sh
      - name: Publish simulator output
        if: always()
        run: |
          mkdir -p sim-out && grep -nE "error:|BUILD FAILED|\*\* BUILD" build.log | head -100 > sim-out/build-errors.txt || true
          bash .github/publish-dir.sh sim "$GITHUB_WORKSPACE/sim-out" "${{ github.token }}"

  release:
    needs: [ android, ios ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: CoreDump-*
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CORE DUMP build ${{ github.run_number }}
          body: |
            CoreDump.apk — install directly on Android (allow unknown sources).
            CoreDump-unsigned.ipa — sideload with AltStore / SideStore / Sideloadly (they sign it with your Apple ID).
          files: |
            out/CoreDump.apk
            out/CoreDump-unsigned.ipa
